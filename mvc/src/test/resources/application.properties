# Test-only properties.
# This file is loaded from src/test/resources before src/main/resources during Maven tests.

# Toss Payments API
api.toss.secret-key=test_toss_secret_key
api.toss.client-key=test_toss_client_key
api.toss.base-url=https://api.tosspayments.com

# Kakao API
api.kakao.rest-api-key=test_kakao_rest_api_key
api.kakao.book-url=https://dapi.kakao.com/v3/search/book
api.kakao.map-url=https://dapi.kakao.com
api.kakao.map.js-key=test_kakao_map_js_key

# Naver API
api.naver.client-id=test_naver_api_client_id
api.naver.client-secret=test_naver_api_client_secret

# DB
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
db.username=sa
db.password=

# Redis
redis.host=localhost
redis.port=6379
redis.password=
redis.ssl.enabled=false
redis.database=0

file.dir=target/test-uploads

# Kakao OAuth
api.kakao.login-url=https://kauth.kakao.com
api.kakao.api-url=https://kapi.kakao.com
api.kakao.client.id=test_kakao_client_id
api.kakao.redirect.uri=http://localhost:8080/auth/kakao/callback
api.kakao.client_secret=test_kakao_client_secret

# Naver OAuth
api.naver.login-url=https://nid.naver.com
api.naver.api-url=https://openapi.naver.com
api.naver.client.id=test_naver_client_id
api.naver.client.secret=test_naver_client_secret
api.naver.redirect.uri=http://localhost:8080/auth/naver/callback

# Google SMTP
mail.username=test@example.com
mail.password=test_mail_password

# AWS S3
AWS_ACCESS_KEY=test_aws_access_key
AWS_SECRET_ACCESS_KEY=test_aws_secret_access_key
AWS_S3_BUCKET=test-bucket
AWS_S3_REGION=ap-northeast-2
AWS_CLOUDFRONT_DOMAIN=

# Admin
admin.login.code1=test_admin_code1
admin.login.code2=test_admin_code2

# AES
aes.secret-key=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=

# WebSocket CORS
app.cors.allowed-origins=http://localhost:8080
