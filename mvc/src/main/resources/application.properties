# Admin
admin.login.code1=${ADMIN_LOGIN_CODE1}
admin.login.code2=${ADMIN_LOGIN_CODE2}

# AES
aes.secret-key=${AES_SECRET_KEY}

# WebSocket CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}
