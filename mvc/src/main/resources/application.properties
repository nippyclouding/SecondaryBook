# Toss Payments API
api.toss.secret-key=${TOSS_SECRET_KEY}
api.toss.client-key=${TOSS_CLIENT_KEY}
api.toss.base-url=${TOSS_BASE_URL}

# Kakao API
api.kakao.rest-api-key=${KAKAO_REST_API_KEY}
api.kakao.book-url=${KAKAO_BOOK_URL}
api.kakao.map-url=${KAKAO_MAP_URL:}
api.kakao.map.js-key=${KAKAO_MAP_JS_KEY}

# Naver API
api.naver.client-id=${NAVER_API_CLIENT_ID:}
api.naver.client-secret=${NAVER_API_CLIENT_SECRET:}

# DB
db.driver=${DB_DRIVER}
db.url=${DB_URL}
db.username=${DB_USERNAME}
