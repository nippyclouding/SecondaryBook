file.dir=${FILE_DIR}

# Kakao OAuth
api.kakao.login-url=${KAKAO_LOGIN_URL}
api.kakao.api-url=${KAKAO_API_URL}
api.kakao.client.id=${KAKAO_CLIENT_ID}
api.kakao.redirect.uri=${KAKAO_REDIRECT_URI}
