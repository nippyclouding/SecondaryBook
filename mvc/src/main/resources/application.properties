# Naver OAuth
api.naver.login-url=${NAVER_LOGIN_URL}
api.naver.api-url=${NAVER_API_URL}
api.naver.client.id=${NAVER_CLIENT_ID}
api.naver.client.secret=${NAVER_CLIENT_SECRET}
api.naver.redirect.uri=${NAVER_REDIRECT_URI}

# Google SMTP
mail.username=${MAIL_USERNAME}
mail.password=${MAIL_PASSWORD}

# AWS S3
AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
AWS_S3_BUCKET=${AWS_S3_BUCKET}
AWS_S3_REGION=${AWS_S3_REGION}
